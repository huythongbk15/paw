[project]
name = "paw"
version = "0.1.0"
description = "PAW — Personal Agent Workstation: independent Personal Agent Runtime"
readme = "src/paw/README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.8",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "rich>=13.7",
    "aiosqlite>=0.19",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "structlog>=24.1",
]

[project.scripts]
paw = "paw.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "pyright>=1.1",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py312"
line-length = 120
exclude = [
    ".git", "__pycache__", ".venv", "dist", "build",
    "src/paw/__pycache__", "skills", "demo_paw.py",
]

[tool.ruff.lint]
select = [
    "E", "F", "I", "N", "W", "UP", "B", "C4", "PTH", "RUF", "SIM", "T20"
]
ignore = []
fixable = ["E", "F", "I", "W", "UP", "RUF", "SIM", "T20", "C4", "N", "PTH"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "N", "W292", "T201", "W291", "W293", "I001", "F401", "F811", "F841", "RUF012", "SIM102", "SIM110", "SIM116", "B007", "E402", "PTH118", "UP017", "UP015", "RUF001", "RUF002", "RUF059", "B904"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
show_error_codes = true
pretty = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["paw*"]
