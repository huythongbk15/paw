[project]
name = "paw"
version = "0.1.0"
description = "PAW — Personal Agent Workstation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.8",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "rich>=13.7",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.19",
    "python-dotenv>=1.0",
    "structlog>=24.1",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[project.scripts]
paw = "paw.cli:app"

[project.optional-dependencies]
dev = [
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "pyright>=1.1",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py312"
line-length = 100
select = [
    "E", "F", "I", "N", "W", "UP", "B", "C4", "PTH", "PD", "PL", "RUF", "SIM", "T20", "PYI", "ARG", "ASYNC"
]
ignore = []
fixable = ["F", "I", "PTH", "PD", "RUF", "SIM", "T20", "ARG"]
unfixable = []
exclude = [".git", "__pycache__", ".venv", "dist", "build"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
show_error_codes = true
pretty = true

[tool.setuptools.packages.find]
where = ["."]
include = ["paw*"]