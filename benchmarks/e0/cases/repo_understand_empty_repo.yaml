schema_version: "1.0.0"
case_id: repo_understand_empty_repo
decision_artifact_version: "1.0.0"
project_revision: "f3ad4ef"
category: repo_understanding
privacy_class: workspace
goal: |
  Validate that the runner can score a near-empty
  repository fixture without crashing and without
  producing a misleading SUCCESS. The fixture is
  the smallest valid input: it has only the case
  contract itself plus the runner's expected markers.
fixtures:
  - path: benchmarks/e0/fixtures/edge_case_empty_repo.txt
    revision: f3ad4ef
    purpose: |
      Challenging input — the smallest possible fixture
      the runner can score. The runner must still
      produce a deterministic result.
expected_evidence:
  - kind: file_contains
    target: benchmarks/e0/fixtures/edge_case_empty_repo.txt
    value: "Edge case fixture"
    reviewer: alice@example.com
  - kind: file_contains
    target: benchmarks/e0/fixtures/edge_case_empty_repo.txt
    value: "deterministic result"
    reviewer: alice@example.com
timeout_seconds: 30
max_iterations: 3
tags:
  - smoke
  - edge-case
  - minimal
